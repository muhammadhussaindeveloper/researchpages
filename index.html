<!DOCTYPE html>

<html lang="en">
    
    <head>
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Research Pages - Write, Organize and Share your research pages</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search,settings" />

    </head>
    
    <body>
        
        <div class="topbar">
            <div class="top">
                <div class="doc-name">
                    <input>
                    <a href="#">
                        <span class="material-symbols-outlined">
                            settings
                        </span>
                    </a>
                </div>
                <div class="toolbar">
                    <div class="search">
                        <input placeholder="search ...">
                        <span class="material-symbols-outlined">
                            search
                        </span>
                    </div>
                </div>
            </div>
            <div class="ribbon"></div>
        </div>
        <div class="pages">
            <textarea rows="25" placeholder="Write your document here ..."></textarea>
        </div>
        <div class="page-settings"></div>

    </body>

</html>
