<!DOCTYPE html>

<html lang="en">
    
    <head>
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Research Pages - Write, Organize and Share your research pages</title>
        <link rel="icon" href="images/favicon.png" type="images/png">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search,settings,save" />

    </head>
    
    <body>
        
        <div class="topbar">
            <div class="top">
                <div class="doc-name">
                    <input placeholder="Document name" value="Document">
                    <a href="#">
                        <span class="material-symbols-outlined">
                            save
                        </span>
                    </a>
                </div>
                <div class="toolbar">
                    <div class="search">
                        <input placeholder="search ...">
                        <span class="material-symbols-outlined">
                            search
                        </span>
                    </div>
                    <div class="home tab">
                        <p>Home</p>
                    </div>
                    <div class="view tab">
                        <p>View</p>
                    </div>
                    <div class="insert tab">
                        <p>Insert</p>
                    </div>
                    <div class="layout tab">
                        <p>Layout</p>
                    </div>
                    <div class="design tab">
                        <p>Design</p>
                    </div>
                </div>
            </div>
            <div class="ribbon">
                <div class="home-styling">
                    <div class="font-family">
                        <input type="text" value="Arial">
                    </div>
                    <div class="font-size"></div>
                    <div class="bold"></div>
                    <div class="italic"></div>
                    <div class="underline"></div>
                    <div class="font-color"></div>
                    <div class="font-bg-color"></div>
                    <div class="text-align"></div>
                    <div class="lists"></div>
                </div>
            </div>
        </div>
        <div class="pages">
            <textarea id="autoBox" rows="29" placeholder="Write your document here ..."></textarea>
        </div>
        <div class="page-settings"></div>

        <script src="js/script.js"></script>

    </body>

</html>
